name: Rust Build (x86_64-pc-windows-gnu)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    env:
      RUSTFLAGS: "-C linker=x86_64-w64-mingw32-gcc"
      CARGO_TARGET_DIR: ./target

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MinGW environment
        run: |
          echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          x86_64-w64-mingw32-gcc --version

      - name: Install Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup target add x86_64-pc-windows-gnu

      - name: Build for x86_64-pc-windows-gnu
        run: cargo build --target x86_64-pc-windows-gnu --release

      # ===== 新增：上传构建产物 =====
      - name: Package executable
        id: package
        run: |
          # 创建清晰的目录结构
          mkdir -p artifacts
          
          # 复制可执行文件到 artifacts 目录（保留原始文件名）
          cp target/x86_64-pc-windows-gnu/release/*.exe artifacts/
          
          # 重命名文件为带版本号的格式（可选但推荐）
          $exeName = (Get-ChildItem artifacts/*.exe).Name
          $version = (cargo metadata --format-version 1 --no-deps | ConvertFrom-Json).packages[0].version
          $newName = "myapp-windows-$version.exe"
          
          mv "artifacts/$exeName" "artifacts/$newName"
          
          # 输出版本信息供后续步骤使用
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "artifact_name=$newName" >> $env:GITHUB_OUTPUT

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}  # 使用动态生成的文件名
          path: artifacts/
          retention-days: 90  # 保留14天（默认90天）
          if-no-files-found: error  # 未找到文件时报错
